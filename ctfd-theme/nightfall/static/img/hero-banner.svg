<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="800" cy="250" rx="700" ry="220" fill="url(#glow)"/>
  <text x="800" y="180" text-anchor="middle" fill="#00e5ff" font-family="JetBrains Mono, Consolas, monospace" font-size="20" letter-spacing="8">SECURITY OPERATIONS</text>
  <text x="800" y="270" text-anchor="middle" fill="#e5e7eb" font-family="Inter, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="2">OPERATION NIGHTFALL</text>
  <text x="800" y="320" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="20" letter-spacing="4">THE CYGNUS LABS BREACH</text>
  <line x1="500" y1="360" x2="1100" y2="360" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>
</svg>
