services:

  # =========================
  # CTFd CONTROL PLANE
  # =========================
  ctfd:
    image: ctfd/ctfd:3.8.0
    container_name: nightfall-ctfd
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - ctfd_front
      - control_net
    mem_limit: 1g
    cpus: 1.00
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd_password@mariadb:3306/ctfd
    depends_on:
      - mariadb

  # =========================
  # DATABASE
  # =========================
  mariadb:
    image: mariadb:11.4
    container_name: nightfall-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=ctfd
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd_password
    networks:
      - control_net
    mem_limit: 512m
    cpus: 0.50

  # =========================
  # NF03 CHALLENGE
  # =========================
  challenge-web:
    build:
      context: ./challenge-web
    container_name: nightfall-challenge-web
    restart: unless-stopped
    networks:
      - challenge_front
    mem_limit: 512m
    cpus: 0.50

  # =========================
  # NF06 CHALLENGE
  # =========================
  challenge-linux:
    build:
      context: ./challenge-linux
    container_name: nightfall-challenge-linux
    restart: unless-stopped
    networks:
      - challenge_front
    mem_limit: 512m
    cpus: 0.50

  # =========================
  # WEB GATEWAY
  # =========================
  gateway-web:
    image: nginx:alpine
    container_name: nightfall-gateway-web
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./gateway-web/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nightfall_ingress
      - challenge_front
    depends_on:
      - challenge-web
    mem_limit: 128m
    cpus: 0.25

  # =========================
  # SSH GATEWAY
  # =========================
  gateway-ssh:
    image: nginx:alpine
    container_name: nightfall-gateway-ssh
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ./gateway-ssh/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nightfall_ingress
      - challenge_front
    depends_on:
      - challenge-linux
    mem_limit: 128m
    cpus: 0.25

networks:

  ctfd_front:
    external: true

  control_net:
    external: true

  challenge_front:
    external: true

  nightfall_ingress:
    external: true